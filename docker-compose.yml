# Mindful AU Backend – App + Worker + Scheduler (external DB, Redis)
#
# Multi-container (default): docker compose up -d
#   Starts: app (Octane API), queue (queue:work), scheduler (schedule:work)
#
# Single-container: docker compose --profile all-in-one up -d all-in-one
#   Runs app + worker + scheduler in one container via supervisord
#
# Set DB_*, REDIS_* and other env vars in .env or pass via -e

name: aucms

x-backend-env: &backend-env
  APP_ENV: production
  APP_DEBUG: false
  TZ: Africa/Harare
  LOG_CHANNEL: errorlog
  LOG_LEVEL: info
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  DB_HOST: db
  DB_DATABASE: aucms
  DB_USERNAME: aucms_user
  DB_PASSWORD: secret

x-backend-build: &backend-build
  context: .
  dockerfile: Dockerfile

services:
  app:
    build: *backend-build
    image: aucms-backend:latest
    restart: unless-stopped
    ports:
      - "8000:80"
    env_file:
      - .env
    environment:
      <<: *backend-env
    volumes:
      - backend_storage:/app/storage
      - backend_cache:/app/bootstrap/cache
      - backend_uploads:/app/storage/app/public
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - aucms

  queue:
    build: *backend-build
    image: aucms-backend:latest
    entrypoint: ["/usr/local/bin/docker-worker-entrypoint.sh"]
    command: php /app/artisan queue:work --sleep=3 --tries=3 --timeout=90
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 60
    env_file:
      - .env
    environment:
      <<: *backend-env
    volumes:
      - backend_storage:/app/storage
      - backend_cache:/app/bootstrap/cache
      - backend_uploads:/app/storage/app/public
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - aucms

  scheduler:
    build: *backend-build
    image: aucms-backend:latest
    entrypoint: ["/usr/local/bin/docker-worker-entrypoint.sh"]
    command: php /app/artisan schedule:work
    restart: unless-stopped
    stop_signal: SIGTERM
    env_file:
      - .env
    environment:
      <<: *backend-env
    volumes:
      - backend_storage:/app/storage
      - backend_cache:/app/bootstrap/cache
      - backend_uploads:/app/storage/app/public
    depends_on:
      app:
        condition: service_started
    networks:
      - aucms

  # Single container: app + worker + scheduler (use when deploying as one container)
  # Run: docker compose --profile all-in-one up -d all-in-one
  all-in-one:
    profiles:
      - all-in-one
    build: *backend-build
    image: aucms-backend:latest
    ports:
      - "8000:80"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *backend-env
      RUN_WORKER_AND_SCHEDULER: "1"
    volumes:
      - backend_storage:/app/storage
      - backend_cache:/app/bootstrap/cache
      - backend_uploads:/app/storage/app/public
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - aucms

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - aucms
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: aucms
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: aucms_user
      MYSQL_PASSWORD: secret
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - aucms

volumes:
  backend_storage:
  backend_cache:
  backend_uploads:
  redis_data:
  db_data:

networks:
  aucms:
    driver: bridge