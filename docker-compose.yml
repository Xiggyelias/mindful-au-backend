name: aucms

x-backend-env: &backend-env
  APP_ENV: production
  APP_DEBUG: false
  LOG_CHANNEL: errorlog
  LOG_LEVEL: info
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  DB_HOST: db
  DB_DATABASE: aucms
  DB_USERNAME: aucms_user
  DB_PASSWORD: secret

x-backend-build: &backend-build
  context: .
  dockerfile: Dockerfile

services:
  app:
    build: *backend-build
    image: aucms-backend:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      <<: *backend-env
    command: ["php", "artisan", "octane:start", "--server=swoole", "--host=0.0.0.0", "--port=8000"]
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_started
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_cache:/var/www/html/bootstrap/cache
    networks:
      - aucms

  queue:
    image: aucms-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *backend-env
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90"]
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_cache:/var/www/html/bootstrap/cache
    networks:
      - aucms

  scheduler:
    image: aucms-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *backend-env
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_started
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_cache:/var/www/html/bootstrap/cache
    networks:
      - aucms

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - aucms
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # db:
  #   image: mysql:8.0
  #   restart: unless-stopped
  #   environment:
  #     MYSQL_DATABASE: aucms
  #     MYSQL_ROOT_PASSWORD: root
  #     MYSQL_USER: aucms_user
  #     MYSQL_PASSWORD: secret
  #   volumes:
  #     - db_data:/var/lib/mysql
  #   networks:
  #     - aucms

volumes:
  backend_storage:
  backend_cache:
  redis_data:
  db_data:

networks:
  aucms:
    driver: bridge