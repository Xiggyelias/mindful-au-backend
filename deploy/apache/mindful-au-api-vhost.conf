<VirtualHost *:80>
    ServerName api.example.com
    Redirect permanent / https://api.example.com/
</VirtualHost>

<IfModule mod_ssl.c>
    <VirtualHost *:443>
        ServerName api.example.com
        DocumentRoot /var/www/mindful-au-main/backend/public

        SSLEngine on
        SSLCertificateFile /etc/letsencrypt/live/api.example.com/fullchain.pem
        SSLCertificateKeyFile /etc/letsencrypt/live/api.example.com/privkey.pem

        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

        ServerSignature Off
        TraceEnable Off

        <Directory /var/www/mindful-au-main/backend/public>
            AllowOverride All
            Require all granted
            Options FollowSymLinks
            FallbackResource /index.php
        </Directory>

        Alias /storage /var/www/mindful-au-main/backend/storage/app/public
        <Directory /var/www/mindful-au-main/backend/storage/app/public>
            Require all granted
            Options FollowSymLinks
        </Directory>

        <FilesMatch "\.php$">
            SetHandler "proxy:unix:/run/php/php8.2-fpm.sock|fcgi://localhost"
        </FilesMatch>

        <LocationMatch "^/(?:\.|.*\.(?:env|ini|log|sh|sql))">
            Require all denied
        </LocationMatch>

        ErrorLog ${APACHE_LOG_DIR}/mindful-au-api-error.log
        CustomLog ${APACHE_LOG_DIR}/mindful-au-api-access.log combined
    </VirtualHost>
</IfModule>
