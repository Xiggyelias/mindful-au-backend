[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:queue-worker]
command=php /var/www/html/artisan queue:work --queue=default --sleep=1 --tries=3 --max-time=3600 --timeout=120 --memory=256
process_name=%(program_name)s_%(process_num)02d
numprocs=2
directory=/var/www/html
autostart=true
autorestart=true
startsecs=1
stopwaitsecs=3600
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
