[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:queue-worker]
command=php /var/www/html/artisan queue:work --queue=default --sleep=%(ENV_QUEUE_WORKER_SLEEP_SECONDS)s --tries=%(ENV_QUEUE_WORKER_TRIES)s --max-time=%(ENV_QUEUE_WORKER_MAX_TIME_SECONDS)s --timeout=%(ENV_QUEUE_WORKER_TIMEOUT_SECONDS)s --memory=%(ENV_QUEUE_WORKER_MEMORY_MB)s
process_name=%(program_name)s_%(process_num)02d
numprocs=%(ENV_QUEUE_WORKER_PROCESSES)s
directory=/var/www/html
autostart=true
autorestart=true
startsecs=1
stopwaitsecs=3600
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
