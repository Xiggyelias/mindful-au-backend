[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:apache]
command=apache2-foreground
directory=/app
autostart=true
autorestart=true
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-worker]
command=php /app/artisan queue:work --queue=default --sleep=%(ENV_QUEUE_WORKER_SLEEP_SECONDS)s --tries=%(ENV_QUEUE_WORKER_TRIES)s --max-time=%(ENV_QUEUE_WORKER_MAX_TIME_SECONDS)s --timeout=%(ENV_QUEUE_WORKER_TIMEOUT_SECONDS)s --memory=%(ENV_QUEUE_WORKER_MEMORY_MB)s
process_name=%(program_name)s_%(process_num)02d
numprocs=%(ENV_QUEUE_WORKER_PROCESSES)s
directory=/app
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:scheduler]
command=php /app/artisan schedule:work
directory=/app
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
